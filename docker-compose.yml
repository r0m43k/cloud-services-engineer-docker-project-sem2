services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-backend:latest}
    container_name: backend
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"
    restart: unless-stopped
    networks:
      - net
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEMORY:-256m}
    cpus: "${BACKEND_CPU:-0.50}"
    secrets:
      - secrets.example

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
          VUE_APP_API_URL: ${VUE_APP_API_URL:-http://localhost:8081}
    image: ${FRONTEND_IMAGE:-frontend:latest}
    container_name: frontend
    ports:
      - "${FRONTEND_HOST_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - net
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${FRONTEND_MEMORY:-128m}
    cpus: "${FRONTEND_CPU:-0.25}"
    secrets:
      - secrets.example

networks:
  net:
    driver: bridge

secrets:
  secrets.example:
    file: ./secrets/secrets.example
